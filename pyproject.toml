[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-desktop-studio"
version = "1.0.0"
description = "Un atelier graphique Python pour créer, explorer et organiser."
requires-python = ">=3.10"
dependencies = ["PySide6==6.8.3", "psutil==7.0.0"]

[project.scripts]
nexus-studio = "nexus.app:main"

[tool.setuptools.packages.find]
include = ["nexus*"]
